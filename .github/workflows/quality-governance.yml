# Quality governance pipeline.
#
# Stages:
#   Test execution
#   Coverage generation
#   Optional static analysis
#   Optional SonarQube quality gate
#   Governance result

name: Quality Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test execution and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test execution and coverage generation
        run: |
          mkdir -p reports
          python -m pytest --junitxml=reports/test-results.xml

      - name: Publish test and coverage artifacts
        uses: actions/upload-artifact@v5
        with:
          name: quality-reports
          retention-days: 14
          if-no-files-found: error
          path: |
            coverage.xml
            htmlcov/
            reports/test-results.xml

  analysis:
    name: Static analysis and quality gate
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check SonarQube configuration
        id: sonar-config
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [[ -n "$SONAR_TOKEN" && -n "$SONAR_HOST_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore coverage report
        if: steps.sonar-config.outputs.configured == 'true'
        uses: actions/download-artifact@v5
        with:
          name: quality-reports
          path: ${{ github.workspace }}

      - name: Check coverage report
        if: steps.sonar-config.outputs.configured == 'true'
        run: test -s coverage.xml

      - name: Static analysis
        if: steps.sonar-config.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        if: steps.sonar-config.outputs.configured == 'true'
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Governance result
        if: steps.sonar-config.outputs.configured == 'true' && success()
        run: |
          echo "Quality gate status: ${{ steps.quality-gate.outputs.quality-gate-status }}"
          echo "Measure values remain on the SonarQube server."

      - name: SonarQube not configured
        if: steps.sonar-config.outputs.configured == 'false'
        run: |
          echo "SonarQube integration is not configured for this repository."
          echo "Automated tests and coverage have completed successfully."
          echo "No SonarQube metrics or quality-gate result are inferred."
          echo "Configure SONAR_TOKEN and SONAR_HOST_URL to enable server-side analysis."