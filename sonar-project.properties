# SonarQube Scanner settings for this repository.
# The scanner reads this file from the project root.
# Bugs, vulnerabilities, code smells, security hotspots, coverage,
# duplications, reliability, and maintainability are results of the
# Python analyzer. They are not switches in this file.
# The quality gate that accepts or rejects a scan is set on the SonarQube server.

sonar.projectKey=software-quality-governance
sonar.projectName=Software Quality and Governance Dashboard
sonar.projectVersion=0.3

# Production code and tests are separate analysis scopes.
# Tests are not included in source coverage or source maintainability.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Cobertura XML written by pytest-cov (coverage.py). Relative to the project root.
sonar.python.coverage.reportPaths=coverage.xml

# Files outside src/ are already outside the source scope.
# These patterns also drop generated output if the scope is widened later.
sonar.exclusions=**/__pycache__/**,**/*.pyc,dashboard/**,htmlcov/**,coverage.xml,.coverage,.scannerwork/**,**/.venv/**,**/venv/**,.pytest_cache/**,reports/**

# Keep tests, the unfinished dashboard, and generated reports out of coverage.
sonar.coverage.exclusions=tests/**,dashboard/**,htmlcov/**,.scannerwork/**,reports/**

# Duplication is measured on src/. Do not count tests or generated files.
sonar.cpd.exclusions=tests/**,dashboard/**,htmlcov/**,.scannerwork/**,reports/**
